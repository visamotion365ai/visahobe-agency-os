server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The PWA shell must never be cached for long so that updates are picked up.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /sw.js {
    add_header Cache-Control "no-store";
    add_header Service-Worker-Allowed "/";
  }

  # API proxy (the WebSocket preview stream is upgraded on the same location).
  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location /health { proxy_pass http://api:8787/health; }
  location /ready  { proxy_pass http://api:8787/ready; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
