<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VisaHOBe Test Portal</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f5f6f8; color: #10151f; }
  header { background: #0a84ff; color: #fff; padding: 20px 24px; }
  main { max-width: 720px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 30px rgba(16,21,31,.08); }
  label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 600; }
  input, select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 16px; }
  button { margin-top: 18px; padding: 13px 20px; border: 0; border-radius: 12px; background: #0a84ff; color: #fff; font-size: 16px; cursor: pointer; }
  .ok { margin-top: 16px; padding: 12px; border-radius: 10px; background: #e8f7ec; color: #14622b; display: none; }
</style>
</head>
<body>
<header><h1>VisaHOBe Test Portal</h1><p>Controlled local test environment for browser automation tests.</p></header>
<main>
  <h2>Applicant details</h2>
  <form id="visa-form" onsubmit="return submitForm(event)">
    <label for="fullName">Full name</label>
    <input id="fullName" name="fullName" type="text" placeholder="Full name" />
    <label for="passport">Passport number</label>
    <input id="passport" name="passport" type="text" placeholder="Passport number" />
    <label for="category">Visa category</label>
    <select id="category" name="category">
      <option>Work Visa</option>
      <option>Student Visa</option>
      <option>Visit Visa</option>
    </select>
    <button id="submit-btn" type="submit">Submit application</button>
  </form>
  <div id="result" class="ok">Application received by the test portal.</div>
  <h2>Second page</h2>
  <p><a id="next-page" href="/second.html">Go to the second page</a></p>
</main>
<script>
  function submitForm(event) {
    event.preventDefault();
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').textContent =
      'Application received for ' + (document.getElementById('fullName').value || 'applicant') +
      ' (passport ' + (document.getElementById('passport').value || 'n/a') + ').';
    return false;
  }
</script>
</body>
</html>
